<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>مِرقاة | التحضير والغياب</title>
<link rel="stylesheet" href="/styles.css?v=5">
<link rel="stylesheet" href="/css/shell.css?v=3">
<link rel="stylesheet" href="/css/components.css?v=6">
</head>
<body>
  <div id="shell" class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img id="schoolLogo" class="sidebar-logo" alt="" style="display:none">
        <span id="schoolName">مِرقاة</span>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <div class="shell-main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="القائمة">☰</button>
        <div class="topbar-user">
          <span id="userName"></span>
          <button id="logoutBtn" class="logout-link">تسجيل الخروج</button>
        </div>
      </header>

      <main class="content">
        <h1 class="page-title">التحضير والغياب</h1>

        <div class="toolbar">
          <select id="f_branch"></select>
          <select id="f_stages"></select>
          <select id="f_grades"></select>
          <select id="f_sections"></select>
          <select id="f_subject"></select>
          <select id="f_term"></select>
          <input type="text" id="f_week" placeholder="الأسبوع (مثال: الأول)" style="max-width:130px">
          <select id="f_day">
            <option value="الأحد">الأحد</option>
            <option value="الاثنين">الاثنين</option>
            <option value="الثلاثاء">الثلاثاء</option>
            <option value="الأربعاء">الأربعاء</option>
            <option value="الخميس">الخميس</option>
          </select>
          <input type="text" id="f_period" placeholder="الحصة" style="max-width:90px">
          <button class="btn btn-primary" id="loadRosterBtn">عرض الشعبة</button>
        </div>

        <div class="table-wrap" id="rosterWrap" style="display:none">
          <table class="data-table">
            <thead>
              <tr>
                <th>الطالب</th>
                <th>الحالة</th>
              </tr>
            </thead>
            <tbody id="rosterTableBody"></tbody>
          </table>
        </div>

        <div id="rosterActions" style="display:none; margin-top:14px;">
          <button class="btn btn-primary" id="saveRosterBtn">حفظ التحضير</button>
          <p class="form-error" id="rosterError"></p>
        </div>

        <h1 class="page-title" style="margin-top:36px; font-size:18px;">سجلاتي الأخيرة</h1>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>الطالب</th>
                <th>المادة</th>
                <th>اليوم</th>
                <th>الحصة</th>
                <th>الحالة</th>
                <th>وقت التسجيل</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="recordsTableBody">
              <tr><td colspan="7" class="loading-row">جارٍ التحميل...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination-bar" id="recordsPaginationBar"></div>
      </main>
    </div>
  </div>

  <!-- نافذة تأكيد الحذف -->
  <div class="modal-overlay" id="confirmModal" hidden>
    <div class="modal" style="max-width:380px">
      <div class="modal-header">
        <h2>تأكيد الحذف</h2>
        <button class="modal-close" id="closeConfirmModal">✕</button>
      </div>
      <div class="modal-body">
        <p class="confirm-message">سيتم حذف سجل التحضير هذا نهائيًا.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="confirmDeleteBtn">حذف نهائيًا</button>
        <button class="btn btn-outline" id="cancelConfirmBtn">تراجع</button>
      </div>
    </div>
  </div>

  <script src="/js/shell.js?v=4"></script>
  <script src="/js/attendance.js?v=3"></script>
</body>
</html>
