<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>مِرقاة | التحضير والغياب</title>
<link rel="stylesheet" href="/styles.css?v=5">
<link rel="stylesheet" href="/css/shell.css?v=3">
<link rel="stylesheet" href="/css/components.css?v=6">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
  <div id="shell" class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img id="schoolLogo" class="sidebar-logo" alt="" style="display:none">
        <span id="schoolName">مِرقاة</span>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <div class="shell-main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="القائمة">☰</button>
        <div class="topbar-user">
          <span id="userName"></span>
          <button id="logoutBtn" class="logout-link">تسجيل الخروج</button>
        </div>
      </header>

      <main class="content">
        <h1 class="page-title">التحضير والغياب</h1>

        <div class="cards-grid" id="statsCards"></div>
        <div class="chart-card" id="statusChartCard" style="display:none;">
          <h3>توزيع حالات التحضير (هذا الأسبوع)</h3>
          <canvas id="statusChart"></canvas>
        </div>

        <div class="tabs">
          <button class="tab-btn active" data-tab="record">تسجيل تحضير</button>
          <button class="tab-btn" data-tab="log">سجل التحضير</button>
          <button class="tab-btn" data-tab="finished">سجلات الأسبوع المنتهي</button>
        </div>

        <!-- ============ تسجيل تحضير ============ -->
        <section class="tab-panel" id="panel-record">
          <div class="toolbar">
            <select id="f_branch"></select>
            <select id="f_stages"></select>
            <select id="f_grades"></select>
            <select id="f_sections"></select>
            <select id="f_subject"></select>
            <select id="f_term"></select>
            <input type="text" id="f_week" placeholder="الأسبوع" readonly style="max-width:130px; background:var(--paper);">
            <select id="f_day">
              <option value="الأحد">الأحد</option><option value="الاثنين">الاثنين</option>
              <option value="الثلاثاء">الثلاثاء</option><option value="الأربعاء">الأربعاء</option>
              <option value="الخميس">الخميس</option>
            </select>
            <input type="text" id="f_period" placeholder="الحصة" style="max-width:90px">
            <button class="btn btn-primary" id="loadRosterBtn">عرض الشعبة</button>
          </div>
          <p id="calendarHint" class="overview-hint" style="display:none;"></p>

          <div class="table-wrap" id="rosterWrap" style="display:none">
            <table class="data-table">
              <thead><tr><th>الطالب</th><th>الحالة</th></tr></thead>
              <tbody id="rosterTableBody"></tbody>
            </table>
          </div>
          <div id="rosterActions" style="display:none; margin-top:14px;">
            <button class="btn btn-primary" id="saveRosterBtn">حفظ التحضير</button>
            <p class="form-error" id="rosterError"></p>
          </div>
        </section>

        <!-- ============ سجل التحضير ============ -->
        <section class="tab-panel" id="panel-log" hidden>
          <div class="toolbar">
            <select id="log_term"><option value="">اختر الترم</option></select>
            <select id="log_week"><option value="">اختر الأسبوع</option></select>
            <select id="log_day"><option value="">اختر اليوم</option></select>
            <button class="btn btn-outline" id="filterLogBtn">تصفية</button>
            <select id="log_employee" style="display:none;"><option value="">كل الموظفين</option></select>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>الطالب</th><th>المادة</th><th>الحصة</th><th>الحالة</th><th>وقت التسجيل</th><th></th></tr></thead>
              <tbody id="logTableBody"><tr><td colspan="6" class="empty-state">اختر الأسبوع واليوم أولًا</td></tr></tbody>
            </table>
          </div>
          <div class="pagination-bar" id="logPaginationBar"></div>
        </section>

        <!-- ============ سجلات الأسبوع المنتهي ============ -->
        <section class="tab-panel" id="panel-finished" hidden>
          <p class="overview-hint" id="finishedWeekLabel">جارٍ التحديد...</p>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>الطالب</th><th>المادة</th><th>اليوم</th><th>الحصة</th><th>الحالة</th></tr></thead>
              <tbody id="finishedTableBody"><tr><td colspan="5" class="loading-row">جارٍ التحميل...</td></tr></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- نافذة تعديل حالة تحضير -->
  <div class="modal-overlay" id="editModal" hidden>
    <div class="modal" style="max-width:380px">
      <div class="modal-header"><h2>تعديل الحالة</h2><button class="modal-close" id="closeEditModal">✕</button></div>
      <div class="modal-body">
        <div class="form-group">
          <label>الحالة الجديدة</label>
          <select id="ef_status"></select>
        </div>
        <p class="form-error" id="editFormError"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="saveEditBtn">حفظ</button>
        <button class="btn btn-outline" id="cancelEditBtn">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة تأكيد الحذف -->
  <div class="modal-overlay" id="confirmModal" hidden>
    <div class="modal" style="max-width:380px">
      <div class="modal-header"><h2>تأكيد الحذف</h2><button class="modal-close" id="closeConfirmModal">✕</button></div>
      <div class="modal-body"><p class="confirm-message">سيتم حذف سجل التحضير هذا نهائيًا.</p></div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="confirmDeleteBtn">حذف نهائيًا</button>
        <button class="btn btn-outline" id="cancelConfirmBtn">تراجع</button>
      </div>
    </div>
  </div>

  <script src="/js/shell.js?v=5"></script>
  <script src="/js/attendance.js?v=5"></script>
</body>
</html>
