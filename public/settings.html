<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>مِرقاة | الإعدادات</title>
<link rel="stylesheet" href="/styles.css?v=6">
<link rel="stylesheet" href="/css/shell.css?v=6">
<link rel="stylesheet" href="/css/components.css?v=7">
</head>
<body>
  <div id="shell" class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img id="schoolLogo" class="sidebar-logo" alt="" style="display:none">
        <span id="schoolName">مِرقاة</span>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <div class="shell-main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="القائمة">☰</button>
        <div class="topbar-user">
          <span id="userName"></span>
          <button id="logoutBtn" class="logout-link">تسجيل الخروج</button>
        </div>
      </header>

      <main class="content" id="mainContent">
        <h1 class="page-title">الإعدادات</h1>

        <div class="tabs">
          <button class="tab-btn active" data-tab="lists">القوائم</button>
          <button class="tab-btn" data-tab="school">معلومات المدرسة</button>
          <button class="tab-btn" data-tab="matrix">توزيع المواد</button>
          <button class="tab-btn" data-tab="distribution">توزيع الدرجات</button>
          <button class="tab-btn" data-tab="visibility">الظهور</button>
          <button class="tab-btn" data-tab="schedule">التقويم والجدول</button>
        </div>

        <!-- ============ القوائم ============ -->
        <section class="tab-panel" id="panel-lists">
          <div class="toolbar">
            <select id="listKeySelect">
              <option value="branches">الفروع</option>
              <option value="stages">المراحل</option>
              <option value="grades">الصفوف</option>
              <option value="sections">الشعب</option>
              <option value="subject">المواد</option>
              <option value="user_types">أنواع المستخدمين</option>
              <option value="roles">الأدوار</option>
              <option value="account_statuses">حالات الحساب</option>
              <option value="attendance_statuses">حالات الحضور</option>
              <option value="terms">الترمات</option>
              <option value="behavior_statuses">حالات السلوك</option>
              <option value="continuous_eval_types">نوع التقييم المستمر</option>
              <option value="exam_types">أنواع الاختبارات</option>
            </select>
          </div>
          <div class="chip-list" id="listItems" style="margin-bottom:14px;"></div>
          <div class="toolbar">
            <input type="text" id="newItemInput" placeholder="عنصر جديد...">
            <button class="btn btn-primary btn-sm" id="addItemBtn">إضافة</button>
          </div>
        </section>

        <!-- ============ معلومات المدرسة ============ -->
        <section class="tab-panel" id="panel-school" hidden>
          <form id="schoolForm" style="max-width:420px">
            <div class="form-group"><label>اسم المدرسة</label><input type="text" id="sf_name" required></div>
            <div class="form-group"><label>رابط الشعار (رابط صورة مباشر، ليس رابط ألبوم)</label><input type="text" id="sf_logo"></div>
            <button type="submit" class="btn btn-primary">حفظ</button>
            <p class="form-error" id="schoolFormError"></p>
          </form>
        </section>

        <!-- ============ توزيع المواد ============ -->
        <section class="tab-panel" id="panel-matrix" hidden>
          <div class="toolbar">
            <select id="mx_branch"></select>
            <select id="mx_stages"></select>
            <select id="mx_grades"></select>
            <select id="mx_sections"></select>
            <select id="mx_subject"></select>
            <button class="btn btn-primary btn-sm" id="addMatrixBtn">إضافة صف</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>الفرع</th><th>المرحلة</th><th>الصف</th><th>الشعبة</th><th>المادة</th><th></th></tr></thead>
              <tbody id="matrixTableBody"><tr><td colspan="6" class="loading-row">جارٍ التحميل...</td></tr></tbody>
            </table>
          </div>
        </section>

        <!-- ============ توزيع الدرجات ============ -->
        <section class="tab-panel" id="panel-distribution" hidden>
          <div class="toolbar">
            <select id="gd_subject"></select>
            <select id="gd_eval_type"></select>
            <input type="number" id="gd_percentage" placeholder="النسبة" style="max-width:100px" min="0" max="100">
            <button class="btn btn-primary btn-sm" id="addDistBtn">إضافة</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>المادة</th><th>نوع التقييم</th><th>النسبة</th><th></th></tr></thead>
              <tbody id="distTableBody"><tr><td colspan="4" class="loading-row">جارٍ التحميل...</td></tr></tbody>
            </table>
          </div>
        </section>

        <!-- ============ الظهور ============ -->
        <section class="tab-panel" id="panel-visibility" hidden>
          <div class="form-group">
            <label>الصفوف التي تظهر نتائجها لأولياء الأمور (التحكم بعرض النتائج)</label>
            <div class="checkbox-group" id="vis_results"></div>
          </div>
          <div class="form-group">
            <label>الصفوف التي تظهر درجاتها التفصيلية (التحكم بعرض الدرجات)</label>
            <div class="checkbox-group" id="vis_grades"></div>
          </div>
          <div class="form-group">
            <label><input type="checkbox" id="vis_manual_date" style="width:auto"> السماح لكل الموظفين بتحديد تاريخ/أسبوع التحضير والرصد يدويًا (بدل ربطه إجباريًا بالتقويم الدراسي)</label>
          </div>
          <button class="btn btn-primary" id="saveVisibilityBtn">حفظ إعدادات الظهور</button>
          <p class="form-error" id="visibilityError"></p>
        </section>

        <!-- ============ التقويم والجدول ============ -->
        <section class="tab-panel" id="panel-schedule" hidden>
          <div class="tabs" style="margin-bottom:16px;">
            <button class="tab-btn active" data-schedview="calendar">أسابيع التقويم</button>
            <button class="tab-btn" data-schedview="timetable">الحصص والاختبارات</button>
          </div>

          <div id="schedview-calendar">
            <div class="toolbar">
              <select id="cal_termFilter"><option value="">كل الترمات</option></select>
              <div class="spacer"></div>
              <button class="btn btn-primary" id="addCalendarBtn">+ إضافة أسبوع</button>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead><tr><th>الترم</th><th>الفترة</th><th>الأسبوع</th><th>البداية</th><th>النهاية</th><th>الحدث</th><th>اللون</th><th></th></tr></thead>
                <tbody id="calendarTableBody"><tr><td colspan="8" class="loading-row">جارٍ التحميل...</td></tr></tbody>
              </table>
            </div>
          </div>

          <div id="schedview-timetable" hidden>
            <div class="toolbar">
              <select id="tt_type">
                <option value="">كل الأنواع</option>
                <option value="جدول حصص">جدول حصص</option>
                <option value="جدول اختبار">جدول اختبار</option>
              </select>
              <select id="tt_branch"></select>
              <select id="tt_grade"></select>
              <select id="tt_section"></select>
              <button class="btn btn-outline" id="filterTimetableBtn">تصفية</button>
              <div class="spacer"></div>
              <button class="btn btn-primary" id="addTimetableBtn">+ إضافة حصة/اختبار</button>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead><tr><th>النوع</th><th>اليوم</th><th>الوقت</th><th>المادة</th><th>الصف</th><th>المعلم</th><th></th></tr></thead>
                <tbody id="timetableTableBody"><tr><td colspan="7" class="loading-row">جارٍ التحميل...</td></tr></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- نافذة إضافة/تعديل أسبوع تقويم -->
  <div class="modal-overlay" id="calendarModal" hidden>
    <div class="modal">
      <div class="modal-header"><h2 id="calendarModalTitle">إضافة أسبوع</h2><button class="modal-close" id="closeCalendarModal">✕</button></div>
      <div class="modal-body">
        <form id="calendarForm">
          <div class="form-row">
            <div class="form-group"><label>الترم</label><select id="cf_term"></select></div>
            <div class="form-group"><label>الفترة</label><input type="text" id="cf_period"></div>
          </div>
          <div class="form-group"><label>اسم الأسبوع</label><input type="text" id="cf_week" placeholder="مثال: الأول"></div>
          <div class="form-row">
            <div class="form-group"><label>تاريخ البداية</label><input type="date" id="cf_start"></div>
            <div class="form-group"><label>تاريخ النهاية</label><input type="date" id="cf_end"></div>
          </div>
          <div class="form-group"><label>الحدث</label><input type="text" id="cf_event" placeholder="دراسة / إجازة / اختبارات..."></div>
          <div class="form-group"><label>لون الأسبوع بالتقويم</label><input type="color" id="cf_color" value="#356854" style="height:40px; padding:4px;"></div>
          <p class="form-error" id="calendarFormError"></p>
        </form>
      </div>
      <div class="modal-footer">
        <button type="submit" form="calendarForm" class="btn btn-primary" id="saveCalendarBtn">حفظ</button>
        <button type="button" class="btn btn-outline" id="cancelCalendarBtn">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة إضافة/تعديل حصة/اختبار -->
  <div class="modal-overlay" id="timetableModal" hidden>
    <div class="modal" style="max-width:540px">
      <div class="modal-header"><h2 id="timetableModalTitle">إضافة حصة</h2><button class="modal-close" id="closeTimetableModal">✕</button></div>
      <div class="modal-body">
        <form id="timetableForm">
          <div class="form-group">
            <label>النوع</label>
            <select id="ttf_entry_type"><option value="جدول حصص">جدول حصص</option><option value="جدول اختبار">جدول اختبار</option></select>
          </div>
          <div class="form-row">
            <div class="form-group"><label>الفرع</label><select id="ttf_branch"></select></div>
            <div class="form-group"><label>المرحلة</label><select id="ttf_stage"></select></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>الصف</label><select id="ttf_grade"></select></div>
            <div class="form-group"><label>الشعبة</label><select id="ttf_section"></select></div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>اليوم</label>
              <select id="ttf_day">
                <option value="الأحد">الأحد</option><option value="الاثنين">الاثنين</option>
                <option value="الثلاثاء">الثلاثاء</option><option value="الأربعاء">الأربعاء</option>
                <option value="الخميس">الخميس</option>
              </select>
            </div>
            <div class="form-group"><label>رقم الحصة</label><input type="number" id="ttf_period_number" min="1"></div>
          </div>
          <div class="form-group"><label>الوقت</label><input type="text" id="ttf_time" placeholder="مثال: 8:30 ص"></div>
          <div class="form-row">
            <div class="form-group"><label>تاريخ الاختبار (إن وجد)</label><input type="date" id="ttf_exam_date"></div>
            <div class="form-group"><label>فترة الاختبار</label><input type="text" id="ttf_exam_period"></div>
          </div>
          <div class="form-group"><label>المادة</label><select id="ttf_subject"></select></div>
          <div class="form-group"><label>المعلم (المسؤول/المراقب)</label><input type="text" id="ttf_employeeSearch" placeholder="ابحث عن معلم..." autocomplete="off"></div>
          <div class="chip-list" id="ttf_employeeResults"></div>
          <p style="font-size:12px; color:var(--primary); min-height:16px;" id="ttf_selectedEmployee"></p>
          <input type="hidden" id="ttf_employee_id">
          <p class="form-error" id="timetableFormError"></p>
        </form>
      </div>
      <div class="modal-footer">
        <button type="submit" form="timetableForm" class="btn btn-primary" id="saveTimetableBtn">حفظ</button>
        <button type="button" class="btn btn-outline" id="cancelTimetableBtn">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة تأكيد حذف (تقويم/جدول) -->
  <div class="modal-overlay" id="scheduleConfirmModal" hidden>
    <div class="modal" style="max-width:380px">
      <div class="modal-header"><h2>تأكيد الحذف</h2><button class="modal-close" id="closeScheduleConfirmModal">✕</button></div>
      <div class="modal-body"><p class="confirm-message" id="scheduleConfirmMessage"></p></div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="confirmScheduleDeleteBtn">حذف نهائيًا</button>
        <button class="btn btn-outline" id="cancelScheduleConfirmBtn">تراجع</button>
      </div>
    </div>
  </div>

  <script src="/js/shell.js?v=7"></script>
  <script src="/js/settings.js?v=2"></script>
</body>
</html>
