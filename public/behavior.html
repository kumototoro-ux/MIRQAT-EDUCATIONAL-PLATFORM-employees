<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>مِرقاة | السلوك</title>
<link rel="stylesheet" href="/styles.css?v=6">
<link rel="stylesheet" href="/css/shell.css?v=8">
<link rel="stylesheet" href="/css/components.css?v=8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
  <div id="shell" class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img id="schoolLogo" class="sidebar-logo" alt="" style="display:none">
        <span id="schoolName">مِرقاة</span>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <div class="shell-main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="القائمة">☰</button>
        <div class="topbar-user">
          <button class="user-menu-btn" id="userMenuBtn">
            <span class="user-avatar-circle">؟</span>
            <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="user-menu-dropdown" id="userMenuDropdown">
            <div class="user-menu-header">
              <span class="user-avatar-circle lg">؟</span>
              <div>
                <div class="user-menu-name" id="userMenuName"></div>
                <div class="user-menu-role" id="userMenuRole"></div>
              </div>
            </div>
            <button id="logoutBtn" class="user-menu-logout">تسجيل الخروج</button>
          </div>
        </div>
      </header>

      <main class="content" id="mainContent">
        <h1 class="page-title">السلوك — نظرة عامة</h1>
        <p class="overview-hint">هذه الصفحة لأدمن المدرسة فقط، وتعرض أداء الطلاب ككل — لا يمكن تصفّح سلوك طالب بعينه من هنا.</p>

        <div class="cards-grid" id="statsCards">
          <div class="card skeleton"></div>
          <div class="card skeleton"></div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 20px 0;">
          <div class="chart-card">
            <h3>توزيع الحالات (إيجابي / سلبي)</h3>
            <canvas id="statusChart"></canvas>
          </div>
          <div class="chart-card">
            <h3>توزيع السجلات حسب الترم</h3>
            <canvas id="termChart"></canvas>
          </div>
        </div>

        <div class="chart-card" id="branchChartCard" style="display:none;">
          <h3>توزيع السجلات حسب الفرع</h3>
          <canvas id="branchChart"></canvas>
        </div>

        <h2 style="font-size:16px; color:var(--primary-dark); margin-top:28px;">آخر 100 سجل (للمراجعة)</h2>
        <div class="toolbar">
          <select id="filterBranch"><option value="">كل الفروع</option></select>
          <select id="filterTerm"><option value="">كل الترمات</option></select>
          <select id="filterStatus"><option value="">كل الحالات</option></select>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>الطالب</th><th>الحالة</th><th>الدرجة</th><th>الفرع</th><th>الترم</th><th>سجّلها</th></tr></thead>
            <tbody id="recordsTableBody"><tr><td colspan="6" class="loading-row">جارٍ التحميل...</td></tr></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/shell.js?v=8"></script>
  <script src="/js/behavior.js?v=3"></script>
</body>
</html>
