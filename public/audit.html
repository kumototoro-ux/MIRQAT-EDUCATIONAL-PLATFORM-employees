<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>مِرقاة | سجل التتبع</title>
<link rel="stylesheet" href="/styles.css?v=6">
<link rel="stylesheet" href="/css/shell.css?v=11">
<link rel="stylesheet" href="/css/components.css?v=12">
</head>
<body>
<script>
  // تحقق فوري من الجلسة قبل رسم أي شيء — يمنع "ومضة" الصفحة لمن لم يسجّل دخول
  if (!localStorage.getItem('mirqat_token') || !localStorage.getItem('mirqat_user')) {
    window.location.replace('/index.html');
  }
</script>
  <div id="shell" class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img id="schoolLogo" class="sidebar-logo" alt="" style="display:none">
        <span id="schoolName" class="sidebar-brand-text">مِرقاة</span>
        <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="إغلاق القائمة">✕</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"><!-- تُبنى بالجافاسكربت --></nav>
      <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="طي/توسيع القائمة" title="طي/توسيع القائمة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
      </button>
    </aside>

    <div class="shell-main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="القائمة">☰</button>
        <div class="topbar-search">
          <svg class="topbar-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="topbarSearchInput" placeholder="ابحث عن طالب بالاسم أو المعرّف...">
          <div class="topbar-search-results" id="topbarSearchResults"></div>
        </div>
        <div class="topbar-user">
          <button class="user-menu-btn" id="userMenuBtn">
            <span class="user-avatar-circle">؟</span>
            <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="user-menu-dropdown" id="userMenuDropdown">
            <div class="user-menu-header">
              <span class="user-avatar-circle lg">؟</span>
              <div>
                <div class="user-menu-name" id="userMenuName"></div>
                <div class="user-menu-role" id="userMenuRole"></div>
              </div>
            </div>
            <button id="logoutBtn" class="user-menu-logout">تسجيل الخروج</button>
          </div>
        </div>
      </header>

      <main class="content" id="mainContent">
        <h1 class="page-title">سجل التتبع</h1>

        <div class="toolbar">
          <select id="filterAction"><option value="">كل الإجراءات</option></select>
          <input type="text" id="filterEmpId" placeholder="معرّف الموظف (اختياري)">
          <input type="date" id="filterFrom">
          <input type="date" id="filterTo">
          <button class="btn btn-outline" id="applyFiltersBtn">تصفية</button>
          <div class="spacer"></div>
          <span style="font-size:12px; color:var(--muted);">افتراضيًا آخر 7 أيام</span>
        </div>

        <div class="table-wrap" style="margin-bottom:32px;">
          <table class="data-table">
            <thead><tr><th>الوقت</th><th>الموظف</th><th>الدور</th><th>الإجراء</th><th>التفاصيل</th></tr></thead>
            <tbody id="auditTableBody"><tr><td colspan="5" class="loading-row">جارٍ التحميل...</td></tr></tbody>
          </table>
        </div>
        <div class="pagination-bar" id="auditPaginationBar"></div>

        <h1 class="page-title" style="font-size:18px;">ملخص نشاط معلم</h1>
        <div class="toolbar">
          <input type="text" id="empIdInput" placeholder="معرّف الموظف (مثال: E005)">
          <button class="btn btn-outline" id="loadSummaryBtn">عرض الملخص</button>
        </div>
        <div class="cards-grid" id="summaryCards"></div>
      </main>
    </div>
  </div>

  <script src="/js/shell.js?v=12"></script>
  <script src="/js/audit.js?v=3"></script>
</body>
</html>
