<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>مِرقاة | المهام والإثراءات</title>
<link rel="stylesheet" href="/styles.css?v=6">
<link rel="stylesheet" href="/css/shell.css?v=11">
<link rel="stylesheet" href="/css/components.css?v=10">
</head>
<body>
<script>
  // تحقق فوري من الجلسة قبل رسم أي شيء — يمنع "ومضة" الصفحة لمن لم يسجّل دخول
  if (!localStorage.getItem('mirqat_token') || !localStorage.getItem('mirqat_user')) {
    window.location.replace('/index.html');
  }
</script>
  <div id="shell" class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img id="schoolLogo" class="sidebar-logo" alt="" style="display:none">
        <span id="schoolName" class="sidebar-brand-text">مِرقاة</span>
        <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="إغلاق القائمة">✕</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"><!-- تُبنى بالجافاسكربت --></nav>
      <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="طي/توسيع القائمة" title="طي/توسيع القائمة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
      </button>
    </aside>

    <div class="shell-main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="القائمة">☰</button>
        <div class="topbar-search">
          <svg class="topbar-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="topbarSearchInput" placeholder="ابحث عن طالب بالاسم أو المعرّف...">
          <div class="topbar-search-results" id="topbarSearchResults"></div>
        </div>
        <div class="topbar-user">
          <button class="user-menu-btn" id="userMenuBtn">
            <span class="user-avatar-circle">؟</span>
            <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="user-menu-dropdown" id="userMenuDropdown">
            <div class="user-menu-header">
              <span class="user-avatar-circle lg">؟</span>
              <div>
                <div class="user-menu-name" id="userMenuName"></div>
                <div class="user-menu-role" id="userMenuRole"></div>
              </div>
            </div>
            <button id="logoutBtn" class="user-menu-logout">تسجيل الخروج</button>
          </div>
        </div>
      </header>

      <main class="content">
        <h1 class="page-title">المهام والإثراءات</h1>

        <div class="tabs">
          <button class="tab-btn active" data-tab="tasks">المهام والتكاليف والاختبارات</button>
          <button class="tab-btn" data-tab="enrichments">الإثراءات والفيديوهات</button>
        </div>

        <!-- ============ تبويب المهام ============ -->
        <section class="tab-panel" id="panel-tasks">
          <p class="overview-hint">تُعرض هنا تكاليف الأسبوع الدراسي الحالي فقط.</p>
          <div class="toolbar">
            <select id="t_filterSubject"><option value="">كل المواد</option></select>
            <select id="t_filterTerm"><option value="">كل الترمات</option></select>
            <div class="spacer"></div>
            <button class="btn btn-primary" id="addTaskBtn">+ إضافة تكليف</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>التكليف</th><th>المادة</th><th>النوع</th><th>الصف</th>
                  <th>الاستحقاق</th><th>الدرجة</th><th>الرصد</th><th></th>
                </tr>
              </thead>
              <tbody id="tasksTableBody"><tr><td colspan="8" class="loading-row">جارٍ التحميل...</td></tr></tbody>
            </table>
          </div>
          <div class="pagination-bar" id="tasksPaginationBar"></div>
        </section>

        <!-- ============ تبويب الإثراءات ============ -->
        <section class="tab-panel" id="panel-enrichments" hidden>
          <p class="overview-hint">تُعرض هنا إثراءات الأسبوع الدراسي الحالي فقط.</p>
          <div class="toolbar">
            <select id="e_filterSubject"><option value="">كل المواد</option></select>
            <select id="e_filterType">
              <option value="">كل الأنواع</option>
              <option value="فيديو">فيديو</option>
              <option value="اثراء">إثراء</option>
            </select>
            <div class="spacer"></div>
            <button class="btn btn-primary" id="addEnrichmentBtn">+ إضافة إثراء</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>العنوان</th><th>النوع</th><th>المادة</th><th>الصف</th><th>الرابط</th><th></th>
                </tr>
              </thead>
              <tbody id="enrichmentsTableBody"><tr><td colspan="6" class="loading-row">جارٍ التحميل...</td></tr></tbody>
            </table>
          </div>
          <div class="pagination-bar" id="enrichPaginationBar"></div>
        </section>
      </main>
    </div>
  </div>

  <!-- نافذة إضافة/تعديل تكليف -->
  <div class="modal-overlay" id="taskModal" hidden>
    <div class="modal" style="max-width:540px">
      <div class="modal-header">
        <h2 id="taskModalTitle">إضافة تكليف</h2>
        <button class="modal-close" id="closeTaskModal">✕</button>
      </div>
      <div class="modal-body">
        <form id="taskForm">
          <div class="form-group"><label>اسم التكليف</label><input type="text" id="tf_task_name" required></div>
          <div class="form-group"><label>تفاصيل (اختياري)</label><input type="text" id="tf_details"></div>
          <div class="form-row">
            <div class="form-group"><label>المادة</label><select id="tf_subject"></select></div>
            <div class="form-group"><label>نوع التقييم</label><select id="tf_eval_type"></select></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>الفرع</label><select id="tf_branch"></select></div>
            <div class="form-group"><label>المرحلة</label><select id="tf_stages"></select></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>الصف</label><select id="tf_grades"></select></div>
            <div class="form-group"><label>الشعبة</label><select id="tf_sections"></select></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>الترم</label><select id="tf_term"></select></div>
            <div class="form-group"><label>الدرجة العظمى</label><input type="number" id="tf_max_score" min="0"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>تاريخ الطرح</label><input type="date" id="tf_issue_date"></div>
            <div class="form-group"><label>تاريخ الاستحقاق</label><input type="date" id="tf_due_date"></div>
          </div>
          <div class="form-group"><label>رابط (اختياري)</label><input type="text" id="tf_link"></div>
          <div class="form-group" id="repeatGroup">
            <label><input type="checkbox" id="tf_repeat" style="width:auto"> تكرار أسبوعي حتى تاريخ:</label>
            <input type="date" id="tf_repeat_until" disabled>
          </div>
          <p class="form-error" id="taskFormError"></p>
        </form>
      </div>
      <div class="modal-footer">
        <button type="submit" form="taskForm" class="btn btn-primary" id="saveTaskBtn">حفظ</button>
        <button type="button" class="btn btn-outline" id="cancelTaskBtn">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة إضافة/تعديل إثراء -->
  <div class="modal-overlay" id="enrichModal" hidden>
    <div class="modal" style="max-width:480px">
      <div class="modal-header">
        <h2 id="enrichModalTitle">إضافة إثراء</h2>
        <button class="modal-close" id="closeEnrichModal">✕</button>
      </div>
      <div class="modal-body">
        <form id="enrichForm">
          <div class="form-group"><label>العنوان</label><input type="text" id="ef_title" required></div>
          <div class="form-group"><label>النوع</label>
            <select id="ef_content_type"><option value="فيديو">فيديو</option><option value="اثراء">إثراء</option></select>
          </div>
          <div class="form-row">
            <div class="form-group"><label>المادة</label><select id="ef_subject"></select></div>
            <div class="form-group"><label>الترم</label><select id="ef_term"></select></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>الفرع</label><select id="ef_branch"></select></div>
            <div class="form-group"><label>المرحلة</label><select id="ef_stages"></select></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>الصف</label><select id="ef_grades"></select></div>
            <div class="form-group"><label>الشعبة</label><select id="ef_sections"></select></div>
          </div>
          <div class="form-group"><label>الرابط</label><input type="text" id="ef_link" required></div>
          <div class="form-group"><label>تفاصيل (اختياري)</label><input type="text" id="ef_details"></div>
          <p class="form-error" id="enrichFormError"></p>
        </form>
      </div>
      <div class="modal-footer">
        <button type="submit" form="enrichForm" class="btn btn-primary" id="saveEnrichBtn">حفظ</button>
        <button type="button" class="btn btn-outline" id="cancelEnrichBtn">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة تأكيد الحذف -->
  <div class="modal-overlay" id="confirmModal" hidden>
    <div class="modal" style="max-width:380px">
      <div class="modal-header"><h2>تأكيد الحذف</h2><button class="modal-close" id="closeConfirmModal">✕</button></div>
      <div class="modal-body"><p class="confirm-message" id="confirmMessage"></p></div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="confirmDeleteBtn">حذف نهائيًا</button>
        <button class="btn btn-outline" id="cancelConfirmBtn">تراجع</button>
      </div>
    </div>
  </div>

  <script src="/js/shell.js?v=10"></script>
  <script src="/js/tasks.js?v=4"></script>
</body>
</html>
