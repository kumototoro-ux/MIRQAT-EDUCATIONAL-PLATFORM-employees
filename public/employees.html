<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>مِرقاة | الموظفون</title>
<link rel="stylesheet" href="/styles.css?v=6">
<link rel="stylesheet" href="/css/shell.css?v=8">
<link rel="stylesheet" href="/css/components.css?v=8">
</head>
<body>
  <div id="shell" class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img id="schoolLogo" class="sidebar-logo" alt="" style="display:none">
        <span id="schoolName">مِرقاة</span>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <div class="shell-main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="القائمة">☰</button>
        <div class="topbar-user">
          <button class="user-menu-btn" id="userMenuBtn">
            <span class="user-avatar-circle">؟</span>
            <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="user-menu-dropdown" id="userMenuDropdown">
            <div class="user-menu-header">
              <span class="user-avatar-circle lg">؟</span>
              <div>
                <div class="user-menu-name" id="userMenuName"></div>
                <div class="user-menu-role" id="userMenuRole"></div>
              </div>
            </div>
            <button id="logoutBtn" class="user-menu-logout">تسجيل الخروج</button>
          </div>
        </div>
      </header>

      <main class="content">
        <h1 class="page-title">الموظفون</h1>

        <div class="toolbar">
          <input type="text" id="searchInput" placeholder="ابحث بالاسم أو المعرّف...">
          <select id="filterBranch"><option value="">كل الفروع</option></select>
          <select id="filterRole">
            <option value="">كل الأدوار</option>
            <option value="admin">أدمن</option>
            <option value="teacher">معلم</option>
          </select>
          <div class="spacer"></div>
          <button class="btn btn-primary" id="addEmployeeBtn">+ إضافة موظف</button>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>المعرّف</th>
                <th>الاسم</th>
                <th>الدور</th>
                <th>الفرع</th>
                <th>الصفوف</th>
                <th>المواد</th>
              </tr>
            </thead>
            <tbody id="employeesTableBody">
              <tr><td colspan="6" class="loading-row">جارٍ التحميل...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination-bar" id="paginationBar"></div>
      </main>
    </div>
  </div>

  <!-- نافذة إضافة/تعديل موظف -->
  <div class="modal-overlay" id="employeeModal" hidden>
    <div class="modal" style="max-width:560px">
      <div class="modal-header">
        <h2 id="employeeModalTitle">إضافة موظف</h2>
        <button class="modal-close" id="closeEmployeeModal">✕</button>
      </div>
      <div class="modal-body">
        <form id="employeeForm">
          <div class="form-row">
            <div class="form-group">
              <label for="f_name_ar">اسم الموظف</label>
              <input type="text" id="f_name_ar" required>
            </div>
            <div class="form-group">
              <label for="f_role">الدور</label>
              <select id="f_role">
                <option value="teacher">معلم</option>
                <option value="admin">أدمن</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>الفرع (يمكن اختيار أكثر من فرع)</label>
            <div class="checkbox-group" id="cg_branch"></div>
          </div>
          <div class="form-group">
            <label>المرحلة</label>
            <div class="checkbox-group" id="cg_stages"></div>
          </div>
          <div class="form-group">
            <label>الصفوف</label>
            <div class="checkbox-group" id="cg_grades"></div>
          </div>
          <div class="form-group">
            <label>الشعب</label>
            <div class="checkbox-group" id="cg_sections"></div>
          </div>
          <div class="form-group">
            <label>المواد</label>
            <div class="checkbox-group" id="cg_subject"></div>
          </div>

          <div class="form-group">
            <label for="f_national_id">رقم الهوية (اختياري)</label>
            <input type="text" id="f_national_id">
          </div>
          <p class="form-error" id="employeeFormError"></p>
        </form>
      </div>
      <div class="modal-footer">
        <button type="submit" form="employeeForm" class="btn btn-primary" id="saveEmployeeBtn">حفظ</button>
        <button type="button" class="btn btn-outline" id="cancelEmployeeBtn">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة تأكيد الحذف -->
  <div class="modal-overlay" id="confirmModal" hidden>
    <div class="modal" style="max-width:380px">
      <div class="modal-header">
        <h2>تأكيد الحذف</h2>
        <button class="modal-close" id="closeConfirmModal">✕</button>
      </div>
      <div class="modal-body">
        <p class="confirm-message" id="confirmMessage"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="confirmDeleteBtn">حذف نهائيًا</button>
        <button class="btn btn-outline" id="cancelConfirmBtn">تراجع</button>
      </div>
    </div>
  </div>

  <script src="/js/shell.js?v=8"></script>
  <script src="/js/employees.js?v=3"></script>
</body>
</html>
