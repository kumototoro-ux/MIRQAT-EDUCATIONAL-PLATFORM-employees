<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>مِرقاة | الطلاب</title>
<link rel="stylesheet" href="/styles.css?v=6">
<link rel="stylesheet" href="/css/shell.css?v=11">
<link rel="stylesheet" href="/css/components.css?v=12">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
<script>
  // تحقق فوري من الجلسة قبل رسم أي شيء — يمنع "ومضة" الصفحة لمن لم يسجّل دخول
  if (!localStorage.getItem('mirqat_token') || !localStorage.getItem('mirqat_user')) {
    window.location.replace('/index.html');
  }
</script>
  <div id="shell" class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img id="schoolLogo" class="sidebar-logo" alt="" style="display:none">
        <span id="schoolName" class="sidebar-brand-text">مِرقاة</span>
        <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="إغلاق القائمة">✕</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"><!-- تُبنى بالجافاسكربت --></nav>
      <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="طي/توسيع القائمة" title="طي/توسيع القائمة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
      </button>
    </aside>

    <div class="shell-main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="القائمة">☰</button>
        <div class="topbar-search">
          <svg class="topbar-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="topbarSearchInput" placeholder="ابحث عن طالب بالاسم أو المعرّف...">
          <div class="topbar-search-results" id="topbarSearchResults"></div>
        </div>
        <div class="topbar-user">
          <button class="user-menu-btn" id="userMenuBtn">
            <span class="user-avatar-circle">؟</span>
            <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="user-menu-dropdown" id="userMenuDropdown">
            <div class="user-menu-header">
              <span class="user-avatar-circle lg">؟</span>
              <div>
                <div class="user-menu-name" id="userMenuName"></div>
                <div class="user-menu-role" id="userMenuRole"></div>
              </div>
            </div>
            <button id="logoutBtn" class="user-menu-logout">تسجيل الخروج</button>
          </div>
        </div>
      </header>

      <main class="content">
        <h1 class="page-title">الطلاب</h1>

        <div class="toolbar">
          <input type="text" id="searchInput" placeholder="ابحث بالاسم أو المعرّف...">
          <select id="filterBranch"><option value="">كل الفروع</option></select>
          <select id="filterStage"><option value="">كل المراحل</option></select>
          <select id="filterGrade"><option value="">كل الصفوف</option></select>
          <select id="filterSection"><option value="">كل الشعب</option></select>
          <div class="spacer"></div>
          <button class="btn btn-primary" id="addStudentBtn" style="display:none">+ إضافة طالب</button>
        </div>

        <div class="table-wrap" id="resultsTableWrap" style="display:none">
          <table class="data-table">
            <thead>
              <tr>
                <th>المعرّف</th>
                <th>الاسم</th>
                <th>الفرع</th>
                <th>المرحلة</th>
                <th>الصف</th>
                <th>الشعبة</th>
                <th>حالة الرسوم</th>
              </tr>
            </thead>
            <tbody id="studentsTableBody"></tbody>
          </table>
        </div>
        <div class="pagination-bar" id="paginationBar"></div>

        <!-- ============ نظرة عامة: تظهر افتراضيًا قبل أي فلترة ============ -->
        <div id="overviewSection">
          <p class="overview-hint">ابحث أو فلتر لعرض قائمة الطلاب — لتفادي تحميل آلاف السجلات دفعة واحدة، هذه نظرة عامة سريعة بدلها.</p>

          <div class="cards-grid" id="statsCards">
            <div class="card skeleton"></div>
            <div class="card skeleton"></div>
            <div class="card skeleton"></div>
          </div>

          <div class="chart-card">
            <h3>توزيع الطلاب حسب الصف</h3>
            <canvas id="gradesChart"></canvas>
          </div>

          <h3 style="font-size:14px; color:var(--primary-dark); margin: 24px 0 10px;">آخر 10 طلاب مُضافين</h3>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>المعرّف</th><th>الاسم</th><th>الفرع</th><th>الصف</th></tr></thead>
              <tbody id="recentTableBody"><tr><td colspan="4" class="loading-row">جارٍ التحميل...</td></tr></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- نافذة إضافة/تعديل طالب -->
  <div class="modal-overlay" id="studentModal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="studentModalTitle">إضافة طالب</h2>
        <button class="modal-close" id="closeStudentModal">✕</button>
      </div>
      <div class="modal-body">
        <form id="studentForm">
          <div class="form-group">
            <label for="f_name_ar">اسم الطالب</label>
            <input type="text" id="f_name_ar" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="f_branch">الفرع</label>
              <select id="f_branch"></select>
            </div>
            <div class="form-group">
              <label for="f_stages">المرحلة</label>
              <select id="f_stages"></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="f_grades">الصف</label>
              <select id="f_grades"></select>
            </div>
            <div class="form-group">
              <label for="f_sections">الشعبة</label>
              <select id="f_sections"></select>
            </div>
          </div>
          <div class="form-group">
            <label for="f_national_id">رقم الهوية (اختياري)</label>
            <input type="text" id="f_national_id">
          </div>
          <p class="form-error" id="studentFormError"></p>
        </form>
      </div>
      <div class="modal-footer">
        <button type="submit" form="studentForm" class="btn btn-primary" id="saveStudentBtn">حفظ</button>
        <button type="button" class="btn btn-outline" id="cancelStudentBtn">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة تأكيد الحذف -->
  <div class="modal-overlay" id="confirmModal" hidden>
    <div class="modal" style="max-width:380px">
      <div class="modal-header">
        <h2>تأكيد الحذف</h2>
        <button class="modal-close" id="closeConfirmModal">✕</button>
      </div>
      <div class="modal-body">
        <p class="confirm-message" id="confirmMessage"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="confirmDeleteBtn">حذف نهائيًا</button>
        <button class="btn btn-outline" id="cancelConfirmBtn">تراجع</button>
      </div>
    </div>
  </div>

  <script src="/js/shell.js?v=12"></script>
  <script src="/js/students.js?v=3"></script>
</body>
</html>
