<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>مِرقاة | التقويم والجدول</title>
<link rel="stylesheet" href="/styles.css?v=6">
<link rel="stylesheet" href="/css/shell.css?v=7">
<link rel="stylesheet" href="/css/components.css?v=8">
</head>
<body>
  <div id="shell" class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img id="schoolLogo" class="sidebar-logo" alt="" style="display:none">
        <span id="schoolName">مِرقاة</span>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <div class="shell-main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="القائمة">☰</button>
        <div class="topbar-user">
          <span id="userName"></span>
          <button id="logoutBtn" class="logout-link">تسجيل الخروج</button>
        </div>
      </header>

      <main class="content">
        <h1 class="page-title">التقويم والجدول الدراسي</h1>
        <p class="overview-hint">هذه الصفحة للعرض فقط. أي إضافة أو تعديل أو حذف للتقويم والجدول يكون من الإعدادات (أدمن فقط).</p>

        <div class="tabs">
          <button class="tab-btn active" data-tab="calendar">التقويم الدراسي</button>
          <button class="tab-btn" data-tab="timetable">جدول الحصص</button>
          <button class="tab-btn" data-tab="exams">جدول الاختبارات</button>
        </div>

        <!-- ============ التقويم الدراسي ============ -->
        <section class="tab-panel" id="panel-calendar">
          <div class="tabs" style="margin-bottom:16px;">
            <button class="tab-btn active" data-calview="month">عرض شهري</button>
            <button class="tab-btn" data-calview="week">عرض أسبوعي</button>
          </div>

          <!-- عرض شهري -->
          <div id="calview-month">
            <div class="month-nav">
              <button class="btn btn-outline btn-sm" id="prevMonthBtn">‹ السابق</button>
              <h2 id="monthLabel"></h2>
              <button class="btn btn-outline btn-sm" id="nextMonthBtn">التالي ›</button>
            </div>
            <div class="month-grid" id="monthGrid"></div>
          </div>

          <!-- عرض أسبوعي -->
          <div id="calview-week" hidden>
            <div class="toolbar">
              <select id="week_termFilter"><option value="">كل الترمات</option></select>
            </div>
            <div class="month-nav">
              <button class="btn btn-outline btn-sm" id="prevWeekBtn">‹ الأسبوع السابق</button>
              <h2 id="weekViewLabel"></h2>
              <button class="btn btn-outline btn-sm" id="nextWeekBtn">الأسبوع التالي ›</button>
            </div>
            <div id="weekList"><p class="loading-row">جارٍ التحميل...</p></div>
          </div>
        </section>

        <!-- ============ جدول الحصص ============ -->
        <section class="tab-panel" id="panel-timetable" hidden>
          <div class="toolbar" id="ttAdminFilters" style="display:none;">
            <select id="tt_branch"></select>
            <select id="tt_grade"></select>
            <select id="tt_section"></select>
            <button class="btn btn-outline" id="filterTimetableBtn">تصفية</button>
          </div>
          <p class="overview-hint">انقر على أي حصة لإنشاء تكليف أو اختبار أو إثراء مرتبط بها مباشرة.</p>
          <div class="timetable-grid" id="timetableGrid"><p class="loading-row">جارٍ التحميل...</p></div>
        </section>

        <!-- ============ جدول الاختبارات ============ -->
        <section class="tab-panel" id="panel-exams" hidden>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>المادة</th><th>الصف</th><th>اليوم</th><th>التاريخ</th><th>الفترة</th><th>المراقب</th></tr></thead>
              <tbody id="examsTableBody"><tr><td colspan="6" class="loading-row">جارٍ التحميل...</td></tr></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- نافذة إنشاء تكليف/إثراء من حصة -->
  <div class="modal-overlay" id="periodModal" hidden>
    <div class="modal" style="max-width:520px">
      <div class="modal-header"><h2 id="periodModalTitle">إنشاء لهذه الحصة</h2><button class="modal-close" id="closePeriodModal">✕</button></div>
      <div class="modal-body">
        <p class="overview-hint" id="periodContext" style="margin-top:0;"></p>
        <div class="tabs" style="margin-bottom:14px;">
          <button class="tab-btn active" data-ptype="task">تكليف / اختبار</button>
          <button class="tab-btn" data-ptype="enrichment">فيديو / إثراء</button>
        </div>

        <form id="periodTaskForm">
          <div class="form-group"><label>اسم التكليف</label><input type="text" id="pt_task_name" required></div>
          <div class="form-row">
            <div class="form-group"><label>نوع التقييم</label><select id="pt_eval_type"></select></div>
            <div class="form-group"><label>الدرجة العظمى</label><input type="number" id="pt_max_score" min="0" required></div>
          </div>
          <div class="form-group"><label>تاريخ الاستحقاق</label><input type="date" id="pt_due_date"></div>
          <p class="form-error" id="periodTaskError"></p>
        </form>

        <form id="periodEnrichForm" hidden>
          <div class="form-group"><label>العنوان</label><input type="text" id="pe_title" required></div>
          <div class="form-group"><label>النوع</label>
            <select id="pe_content_type"><option value="فيديو">فيديو</option><option value="اثراء">إثراء</option></select>
          </div>
          <div class="form-group"><label>الرابط</label><input type="text" id="pe_link" required></div>
          <div class="form-group"><label>تفاصيل (اختياري)</label><input type="text" id="pe_details"></div>
          <p class="form-error" id="periodEnrichError"></p>
        </form>
      </div>
      <div class="modal-footer">
        <button type="submit" form="periodTaskForm" class="btn btn-primary" id="savePeriodTaskBtn">حفظ التكليف</button>
        <button type="submit" form="periodEnrichForm" class="btn btn-primary" id="savePeriodEnrichBtn" hidden>حفظ الإثراء</button>
        <button type="button" class="btn btn-outline" id="cancelPeriodBtn">إلغاء</button>
      </div>
    </div>
  </div>

  <script src="/js/shell.js?v=7"></script>
  <script src="/js/schedule.js?v=4"></script>
</body>
</html>
