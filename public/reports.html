<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>مِرقاة | التقارير</title>
<link rel="stylesheet" href="/styles.css?v=6">
<link rel="stylesheet" href="/css/shell.css?v=13">
<link rel="stylesheet" href="/css/components.css?v=12">
</head>
<body>
<script>
  // تحقق فوري من الجلسة قبل رسم أي شيء — يمنع "ومضة" الصفحة لمن لم يسجّل دخول
  if (!localStorage.getItem('mirqat_token') || !localStorage.getItem('mirqat_user')) {
    window.location.replace('/index.html');
  }
</script>
  <div id="shell" class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img id="schoolLogo" class="sidebar-logo" alt="" style="display:none">
        <span id="schoolName" class="sidebar-brand-text">مِرقاة</span>
        <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="إغلاق القائمة">✕</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="طي/توسيع القائمة" title="طي/توسيع القائمة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
      </button>
    </aside>

    <div class="shell-main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="القائمة">☰</button>
        <div class="topbar-search">
          <svg class="topbar-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="topbarSearchInput" placeholder="ابحث عن طالب بالاسم أو المعرّف...">
          <div class="topbar-search-results" id="topbarSearchResults"></div>
        </div>
        <div class="topbar-user">
          <button class="user-menu-btn" id="userMenuBtn">
            <span class="user-avatar-circle">؟</span>
            <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="user-menu-dropdown" id="userMenuDropdown">
            <div class="user-menu-header">
              <span class="user-avatar-circle lg">؟</span>
              <div>
                <div class="user-menu-name" id="userMenuName"></div>
                <div class="user-menu-role" id="userMenuRole"></div>
              </div>
            </div>
            <button id="logoutBtn" class="user-menu-logout">تسجيل الخروج</button>
          </div>
        </div>
      </header>

      <main class="content">
        <div id="accessDenied" style="display:none;"><p class="empty-state">هذه الصفحة تتطلب صلاحية أدمن</p></div>

        <div id="reportsBody">
          <h1 class="page-title">التقارير</h1>

          <div class="tabs no-print" id="reportTypeTabs">
            <button class="tab-btn active" data-rtype="student">تقرير طالب</button>
            <button class="tab-btn" data-rtype="employee">تقرير موظف</button>
            <button class="tab-btn" data-rtype="attendance">تقرير تحضير</button>
            <button class="tab-btn" data-rtype="grading">تقرير أداء (رصد)</button>
          </div>

          <!-- ============ فلاتر تقرير الطالب ============ -->
          <div class="report-filter-panel no-print" id="filters-student">
            <div class="rf-search-wrap">
              <label>ابحث عن الطالب</label>
              <input type="text" id="rs_search" placeholder="اكتب اسم الطالب...">
              <div class="chip-list" id="rs_results" style="margin-top:8px;"></div>
            </div>
            <label>الترم<select id="rs_term"></select></label>
            <div class="rf-actions"><button class="btn btn-primary" id="rs_generateBtn" disabled>إنشاء التقرير</button></div>
          </div>

          <!-- ============ فلاتر تقرير الموظف ============ -->
          <div class="report-filter-panel no-print" id="filters-employee" hidden>
            <div class="rf-search-wrap">
              <label>ابحث عن الموظف</label>
              <input type="text" id="re_search" placeholder="اكتب اسم الموظف...">
              <div class="chip-list" id="re_results" style="margin-top:8px;"></div>
            </div>
            <div class="rf-actions"><button class="btn btn-primary" id="re_generateBtn" disabled>إنشاء التقرير</button></div>
          </div>

          <!-- ============ فلاتر تقرير التحضير ============ -->
          <div class="report-filter-panel no-print" id="filters-attendance" hidden>
            <label>الفرع<select id="ra_branch"><option value="">كل الفروع</option></select></label>
            <label>الترم<select id="ra_term"><option value="">كل الترمات</option></select></label>
            <label>الأسبوع<select id="ra_week"><option value="">كل الأسابيع</option></select></label>
            <label>اليوم
              <select id="ra_day">
                <option value="">كل الأيام</option>
                <option value="الأحد">الأحد</option><option value="الاثنين">الاثنين</option>
                <option value="الثلاثاء">الثلاثاء</option><option value="الأربعاء">الأربعاء</option>
                <option value="الخميس">الخميس</option>
              </select>
            </label>
            <div class="rf-actions"><button class="btn btn-primary" id="ra_generateBtn">إنشاء التقرير</button></div>
          </div>

          <!-- ============ فلاتر تقرير الأداء (رصد) ============ -->
          <div class="report-filter-panel no-print" id="filters-grading" hidden>
            <label>الفرع<select id="rg_branch"><option value="">كل الفروع</option></select></label>
            <label>الترم<select id="rg_term"><option value="">كل الترمات</option></select></label>
            <label>الأسبوع<select id="rg_week"><option value="">كل الأسابيع</option></select></label>
            <label>المادة<select id="rg_subject"><option value="">كل المواد</option></select></label>
            <label>الصف<select id="rg_grades"><option value="">كل الصفوف</option></select></label>
            <div class="rf-actions"><button class="btn btn-primary" id="rg_generateBtn">إنشاء التقرير</button></div>
          </div>

          <div id="reportPreviewWrap" style="display:none; margin-top:20px;">
            <div class="no-print" style="margin-bottom:14px; display:flex; gap:10px;">
              <button class="btn btn-primary" id="printReportBtn">🖨 طباعة / تنزيل PDF</button>
              <button class="btn btn-outline" id="closeReportBtn">إغلاق التقرير</button>
            </div>
            <div class="report-preview" id="reportPreview"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/shell.js?v=13"></script>
  <script src="/js/reports.js?v=2"></script>
</body>
</html>
