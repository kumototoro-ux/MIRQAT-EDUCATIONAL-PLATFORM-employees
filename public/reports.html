<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>مِرقاة | التقارير</title>
<link rel="stylesheet" href="/styles.css?v=6">
<link rel="stylesheet" href="/css/shell.css?v=8">
<link rel="stylesheet" href="/css/components.css?v=8">
</head>
<body>
  <div id="shell" class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img id="schoolLogo" class="sidebar-logo" alt="" style="display:none">
        <span id="schoolName">مِرقاة</span>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>

    <div class="shell-main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="القائمة">☰</button>
        <div class="topbar-user">
          <button class="user-menu-btn" id="userMenuBtn">
            <span class="user-avatar-circle">؟</span>
            <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="user-menu-dropdown" id="userMenuDropdown">
            <div class="user-menu-header">
              <span class="user-avatar-circle lg">؟</span>
              <div>
                <div class="user-menu-name" id="userMenuName"></div>
                <div class="user-menu-role" id="userMenuRole"></div>
              </div>
            </div>
            <button id="logoutBtn" class="user-menu-logout">تسجيل الخروج</button>
          </div>
        </div>
      </header>

      <main class="content">
        <h1 class="page-title">التقارير وبطاقة الطالب</h1>

        <div class="toolbar">
          <input type="text" id="studentSearch" placeholder="ابحث عن طالب بالاسم أو المعرّف...">
          <select id="termSelect"></select>
        </div>
        <div class="chip-list" id="searchResults" style="margin-bottom:20px;"></div>

        <div id="reportSection" style="display:none;">
          <div class="card" style="margin-bottom:20px; border-right-color:var(--primary)">
            <div class="card-value" id="rc_name" style="font-size:20px;"></div>
            <div class="card-label" id="rc_meta"></div>
          </div>

          <div class="table-wrap" style="margin-bottom:28px;">
            <table class="data-table">
              <thead>
                <tr><th>المادة</th><th>المجموع</th><th>ظاهر لولي الأمر؟</th><th></th></tr>
              </thead>
              <tbody id="gradesTableBody"></tbody>
            </table>
          </div>

          <div id="comparisonResult" class="table-wrap" style="display:none; margin-bottom:28px;"></div>

          <h2 style="font-size:16px; color:var(--primary-dark)">آخر سجلات السلوك</h2>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>التاريخ</th><th>الحالة</th><th>الدرجة</th><th>الملاحظة</th></tr></thead>
              <tbody id="behaviorTableBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/shell.js?v=8"></script>
  <script src="/js/reports.js?v=2"></script>
</body>
</html>
