<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>مِرقاة | حسابات الدخول</title>
<link rel="stylesheet" href="/styles.css?v=6">
<link rel="stylesheet" href="/css/shell.css?v=11">
<link rel="stylesheet" href="/css/components.css?v=11">
</head>
<body>
<script>
  // تحقق فوري من الجلسة قبل رسم أي شيء — يمنع "ومضة" الصفحة لمن لم يسجّل دخول
  if (!localStorage.getItem('mirqat_token') || !localStorage.getItem('mirqat_user')) {
    window.location.replace('/index.html');
  }
</script>
  <div id="shell" class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img id="schoolLogo" class="sidebar-logo" alt="" style="display:none">
        <span id="schoolName" class="sidebar-brand-text">مِرقاة</span>
        <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="إغلاق القائمة">✕</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"><!-- تُبنى بالجافاسكربت --></nav>
      <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="طي/توسيع القائمة" title="طي/توسيع القائمة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
      </button>
    </aside>

    <div class="shell-main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="القائمة">☰</button>
        <div class="topbar-search">
          <svg class="topbar-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="topbarSearchInput" placeholder="ابحث عن طالب بالاسم أو المعرّف...">
          <div class="topbar-search-results" id="topbarSearchResults"></div>
        </div>
        <div class="topbar-user">
          <button class="user-menu-btn" id="userMenuBtn">
            <span class="user-avatar-circle">؟</span>
            <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="user-menu-dropdown" id="userMenuDropdown">
            <div class="user-menu-header">
              <span class="user-avatar-circle lg">؟</span>
              <div>
                <div class="user-menu-name" id="userMenuName"></div>
                <div class="user-menu-role" id="userMenuRole"></div>
              </div>
            </div>
            <button id="logoutBtn" class="user-menu-logout">تسجيل الخروج</button>
          </div>
        </div>
      </header>

      <main class="content" id="mainContent">
        <h1 class="page-title">حسابات الدخول</h1>

        <div class="tabs">
          <button class="tab-btn active" data-kind="staff">حسابات الموظفين</button>
          <button class="tab-btn" data-kind="student">حسابات الطلاب</button>
        </div>

        <div class="chart-card" style="margin-bottom:20px;">
          <h3 id="createTitle">إنشاء حساب موظف جديد</h3>
          <div class="form-group">
            <label id="ownerSearchLabel">ابحث عن الموظف المراد إنشاء حساب له</label>
            <input type="text" id="ownerSearch" placeholder="اكتب الاسم أو المعرّف..." autocomplete="off">
            <div class="chip-list" id="ownerResults" style="margin-top:8px;"></div>
            <p id="selectedOwner" style="font-size:13px; color:var(--primary); min-height:18px; margin-top:6px;"></p>
            <input type="hidden" id="ownerId">
          </div>
          <div class="form-row">
            <div class="form-group"><label>اسم المستخدم</label><input type="text" id="newUsername"></div>
            <div class="form-group"><label>كلمة المرور</label><input type="text" id="newPassword" placeholder="6 أحرف على الأقل"></div>
          </div>
          <button class="btn btn-primary" id="createAccountBtn">إنشاء الحساب</button>
          <p class="form-error" id="createError"></p>
        </div>

        <div class="account-cards-grid" id="accountsGrid"><p class="loading-row">جارٍ التحميل...</p></div>
      </main>
    </div>
  </div>

  <!-- نافذة تعديل حساب -->
  <div class="modal-overlay" id="editModal" hidden>
    <div class="modal">
      <div class="modal-header"><h2>تعديل الحساب</h2><button class="modal-close" id="closeEditModal">✕</button></div>
      <div class="modal-body">
        <form id="editForm">
          <div class="form-group"><label>اسم المستخدم الجديد (اتركه فارغًا لعدم التغيير)</label><input type="text" id="ef_username"></div>
          <div class="form-group"><label>كلمة مرور جديدة (اتركها فارغة لعدم التغيير)</label><input type="text" id="ef_password"></div>
          <p class="form-error" id="editFormError"></p>
        </form>
      </div>
      <div class="modal-footer">
        <button type="submit" form="editForm" class="btn btn-primary" id="saveEditBtn">حفظ</button>
        <button type="button" class="btn btn-outline" id="cancelEditBtn">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة تأكيد الحذف -->
  <div class="modal-overlay" id="confirmModal" hidden>
    <div class="modal" style="max-width:380px">
      <div class="modal-header"><h2>تأكيد الحذف</h2><button class="modal-close" id="closeConfirmModal">✕</button></div>
      <div class="modal-body"><p class="confirm-message">سيتم حذف حساب الدخول هذا نهائيًا (بيانات الموظف/الطالب نفسها لن تُحذف).</p></div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="confirmDeleteBtn">حذف نهائيًا</button>
        <button class="btn btn-outline" id="cancelConfirmBtn">تراجع</button>
      </div>
    </div>
  </div>

  <script src="/js/shell.js?v=11"></script>
  <script src="/js/accounts.js?v=2"></script>
</body>
</html>
